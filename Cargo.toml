[package]
name = "figma-canvas-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MCP server that reads a live Figma canvas over a local plugin bridge and reconstructs it as code"
license = "MIT"
repository = "https://github.com/swiftkimani/figma-canvas-mcp"
keywords = ["figma", "mcp", "design-to-code", "codegen"]
categories = ["development-tools", "command-line-utilities"]

[profile.release]
strip = true
lto = "thin"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
rmcp = { version = "3.5.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time", "fs"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["v4"] }
